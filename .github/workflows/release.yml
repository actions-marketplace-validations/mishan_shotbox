# Publish a release: pushing a tag vX.Y.Z runs ci.yml first, then publishes
# the Python package to PyPI and the Node package to npm, each only if the
# tag is its version, and once PyPI has it, server.json to the MCP
# registry. All over GitHub's OIDC, trusted publishing: no token is kept
# anywhere. docs/releasing.md has the one-time setup and
# the steps for a release.

name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  pypi:
    needs: test
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - name: The tag is the version
        run: |
          v=$(python3 -c "import shotbox; print(shotbox.__version__)")
          [ "${GITHUB_REF_NAME#v}" = "$v" ] || { echo "tag $GITHUB_REF_NAME, version $v"; exit 1; }
      - name: Build
        run: |
          python3 -m venv /tmp/build
          /tmp/build/bin/pip install -q build
          /tmp/build/bin/python -m build --outdir dist
      - uses: pypa/gh-action-pypi-publish@release/v1

  npm:
    needs: test
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # npm 11.5.1 or later, for trusted publishing.
      - run: npm install -g npm@^11.5.1
      - name: The tag is the version
        id: version
        run: |
          v=$(node -p "require('./package.json').version")
          [ "${GITHUB_REF_NAME#v}" = "$v" ] || { echo "tag $GITHUB_REF_NAME, version $v"; exit 1; }
          # Already there: published by hand (the first release has to be,
          # see docs/releasing.md), or a rerun. Trusted publishing adds
          # provenance to the rest.
          if npm view "shotbox@$v" version >/dev/null 2>&1; then
            echo "shotbox $v is already on npm"
            echo "published=yes" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.version.outputs.published != 'yes'
        run: npm ci && npm publish

  mcp-registry:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - name: The tag is the version
        run: |
          v=$(python3 -c "import json; s = json.load(open('server.json')); print(*{s['version'], *(p['version'] for p in s['packages'])})")
          [ "${GITHUB_REF_NAME#v}" = "$v" ] || { echo "tag $GITHUB_REF_NAME, server.json $v"; exit 1; }
      - name: mcp-publisher
        run: |
          curl -fsSL https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz \
            | tar xz mcp-publisher
      # The registry checks PyPI's page for the version names the entry,
      # which can take a minute to show after publishing.
      - name: Publish
        run: |
          ./mcp-publisher login github-oidc
          for n in 1 2 3 4 5 6; do
            ./mcp-publisher publish && exit 0
            sleep 30
          done
          exit 1
