# test/run.sh, on every push and pull request. It needs what shotbox
# needs, and it needs it for real: the session, the terminal and the
# pictures are checked against an Xvfb, a dbus-daemon and a VTE, not
# against stand-ins for them. Projects install the Node package from main,
# so a commit that breaks it breaks their next npm install.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # The release workflow runs this first, and publishes only if it passes.
  workflow_call:

permissions:
  contents: read

jobs:
  # test/run.sh's parts, at once: a part of it each, on its own runner,
  # so the ones that time what's on the screen aren't crowded by the rest.
  test:
    runs-on: ubuntu-latest
    # A hung session would hold the runner for GitHub's six hours; record,
    # the slowest, has taken 27 minutes on busy runners.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        part: [core, input, a11y, record]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # The packages' downloads, kept until the runner's image changes.
      - run: echo "image=$ImageOS-$ImageVersion" >> "$GITHUB_ENV"
      - uses: actions/cache@v6
        with:
          path: ~/apt/*.deb
          key: apt-${{ env.image }}-${{ hashFiles('.github/workflows/ci.yml') }}

      # The README's list, and what the tests use besides: GTK 3 for the
      # Python API's button, and cairo for its windows that draw, gdbus
      # to ask the bus what it would activate,
      # ffmpeg for the gif and record, xdotool to move a window off the
      # screen, a monospace font for the terminal, and GTK 4
      # and libadwaita for the accessibility checks' window, and PipeWire,
      # WirePlumber and pactl for --audio, libfaketime for --clock, and
      # Orca for a11y speak: Ubuntu 24.04's is 46.1, one of those it's
      # been checked with.
      - name: Install what shotbox runs
        run: |
          mkdir -p ~/apt/partial
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends -o Dir::Cache::Archives="$HOME/apt" \
            xvfb xauth dbus-daemon imagemagick x11-utils \
            python3-gi python3-gi-cairo gir1.2-gtk-3.0 gir1.2-vte-2.91 \
            libglib2.0-bin ffmpeg fonts-dejavu-core \
            sway grim xwayland wf-recorder \
            at-spi2-core gir1.2-atspi-2.0 gir1.2-gtk-4.0 gir1.2-adw-1 \
            pipewire wireplumber pulseaudio-utils bubblewrap xdotool libfaketime orca

      # For --gamepads: uinput, and its pads, for this user (a desktop's
      # udev gives them to the seat's user; a runner has no seat), and
      # bubblewrap's user namespaces, which Ubuntu's AppArmor holds back.
      - name: Let the runner make gamepads
        run: |
          sudo modprobe uinput
          printf '%s\n' 'KERNEL=="uinput", MODE="0666"' \
            'SUBSYSTEM=="input", ATTRS{name}=="shotbox virtual pad*", MODE="0666"' \
            | sudo tee /etc/udev/rules.d/70-shotbox-ci.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --action=change /dev/uinput
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # Playwright, for the helpers that need a browser. The tests skip
      # rather than fail without it, so CI is where they have to run; they
      # are in core alone, so Chromium is fetched there only, and kept
      # until Playwright changes. Its packages go in every part: without
      # them the a11y and input parts fail, so the tests depend on
      # something they bring.
      - run: npm ci
      - run: npx playwright install-deps chromium
      - if: matrix.part == 'core'
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ env.image }}-${{ hashFiles('package-lock.json') }}
      - if: matrix.part == 'core'
        run: npx playwright install chromium

      - run: test/run.sh
        env:
          SHOTBOX_PART: ${{ matrix.part }}
          SHOTBOX_BROWSER: required
          SHOTBOX_WAYLAND: required
          SHOTBOX_A11Y: required
          SHOTBOX_AUDIO: required
          SHOTBOX_GAMEPAD: required
          SHOTBOX_CLOCK: required
          SHOTBOX_ORCA: required

  # The Action, as another project's job would use it: from a runner with
  # nothing of shotbox's on it, each feature it installs for, sandboxed.
  action:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: ./
        with:
          a11y: true
          wayland: true
          audio: true
          record: true
          term: true
          gamepads: true
          clock: true
      - name: Use it
        working-directory: /tmp
        run: |
          # A line each: bash -e passes over a failure before && or after !.
          shotbox run -- true 2> err
          if grep "without a sandbox" err; then exit 1; fi
          shotbox term --shoot term.png --size 30x4 --when hi -- echo hi
          test -s term.png
          shotbox shoot way.png --wayland --wait stable -- sleep 30
          test -s way.png
          shotbox run --wayland -- shotbox record way.mp4 --seconds 1 > /dev/null
          test -s way.mp4
          shotbox run --a11y -- shotbox a11y tree > /dev/null
          shotbox exec --audio -- shotbox record quiet.wav --seconds 1 > /dev/null
          test -s quiet.wav
          shotbox run --gamepads 1 -- sh -c 'ls /dev/input | grep -q event'
          shotbox exec --clock 2026-09-26T18:40:00 -- date | grep -q 18:40

  # speak on its own, so a11y alone is tried above without Orca, and here
  # speak brings what a11y does: Orca starts from what the Action installed.
  action-speak:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: ./
        with:
          speak: true
      - name: Use it
        working-directory: /tmp
        run: |
          shotbox run --a11y -- shotbox a11y tree > /dev/null
          shotbox run --a11y -- shotbox a11y speak --keys Tab | grep -q '^(start) '

  # What gets published, built and used the way someone who installs it
  # would: the wheel in a fresh venv (with the system's PyGObject, as the
  # README says, so `term --shoot` can start itself again from an install
  # rather than a checkout), and the npm tarball in a fresh project.
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install what shotbox runs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb xauth dbus-daemon imagemagick x11-utils \
            python3-venv python3-gi gir1.2-vte-2.91 fonts-dejavu-core

      - name: The Python package, from a fresh venv
        run: |
          python3 -m venv /tmp/build
          /tmp/build/bin/pip install -q build
          /tmp/build/bin/python -m build --outdir dist
          python3 -m venv --system-site-packages /tmp/use
          /tmp/use/bin/pip install -q dist/*.whl
          cd /tmp
          /tmp/use/bin/python -c "import shotbox; print(shotbox.__version__)"
          /tmp/use/bin/shotbox run -- true
          /tmp/use/bin/shotbox term --shoot /tmp/term.png --size 30x4 --when hi -- echo hi
          test -s /tmp/term.png

      - name: The Node package, from a fresh project
        run: |
          npm pack --pack-destination /tmp
          mkdir /tmp/project && cd /tmp/project
          npm init -y >/dev/null
          npm install -q /tmp/shotbox-*.tgz
          node -e "import('shotbox').then(m => { for (const f of ['serve', 'checks', 'launch', 'gif', 'frames']) if (typeof m[f] !== 'function') throw new Error(f); console.log(Object.keys(m).join(' ')) })"
