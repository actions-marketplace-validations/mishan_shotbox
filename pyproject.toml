# The Python package: the shotbox command, and `import shotbox`. Standard
# library only; what it drives (Xvfb, sway, ImageMagick...) is the system's,
# listed in the README. The version is shotbox/__init__.py's, and
# package.json's too: test/run.sh checks they agree.

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "shotbox"
dynamic = ["version"]
description = "Reproducible screenshots and accessibility checks of real programs in a sealed X11 or Wayland session, with an MCP server for agents"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Misha Nasledov", email = "misha@nasledov.com" }]
requires-python = ">=3.9"
keywords = ["screenshots", "accessibility", "a11y", "at-spi", "wcag", "mcp", "xvfb", "wayland", "sway",
            "visual-regression", "testing", "gtk"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: X11 Applications",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
    "Topic :: Multimedia :: Graphics :: Capture :: Screen Capture",
]

[project.urls]
Homepage = "https://github.com/mishan/shotbox"
Changelog = "https://github.com/mishan/shotbox/blob/main/CHANGELOG.md"
Issues = "https://github.com/mishan/shotbox/issues"

[project.scripts]
shotbox = "shotbox.__main__:main"

[tool.setuptools]
packages = ["shotbox"]

[tool.setuptools.dynamic]
version = { attr = "shotbox.__version__" }
